<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Упражнения - Drumz</title>
    <!-- Подключение стилей abcjs через CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/abcjs@6.5.2/abcjs-audio.min.css">
    <!-- Подключение твоих стилей -->
    <link rel="stylesheet" href="drum+piano.css"> <!-- Путь к CSS файлу в той же папке -->
    <!-- Подключение шрифтов и основных стилей сайта (если нужно) -->
    <!-- <link rel="stylesheet" href="../css/main.css"> --> <!-- Пример, если main.css в родительской папке -->
</head>
<body>
    <div class="container">
        <h1>Барабанные упражнения</h1>

        <!-- Выбор упражнения -->
        <div class="exercise-selector">
            <label for="exerciseSelect">Выберите упражнение:</label>
            <select id="exerciseSelect">
                <!-- Опции будут добавлены через JS -->
            </select>
        </div>

        <!-- Место для отображения нот -->
        <div id="paper"></div>

        <!-- Место для элементов управления воспроизведением -->
        <div id="audio-controls"></div>

    </div>

    <!-- Подключение abcjs через CDN -->
    <script src="https://cdn.jsdelivr.net/npm/abcjs@6.5.2/dist/abcjs-basic-min.min.js"></script>
    <!-- Подключение основного скрипта для упражнений -->
    <script src="drum+piano.js"></script> <!-- Путь к JS файлу в той же папке -->
</body>
</html>
