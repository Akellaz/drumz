  <script src="https://cdn.jsdelivr.net/npm/opensheetmusicdisplay@1.7.0/build/opensheetmusicdisplay.min.js"></script>
  <script>
    // Пример: загрузка одной перкуссионной партитуры (замените URL на ваш)
    async function loadPercussionScore() {
      const container = document.getElementById('scoresContainer');
      const scoreItem = document.createElement('div');
      scoreItem.className = 'score-item';
      scoreItem.innerHTML = `
        <div class="score-title">Пример перкуссионной записи</div>
        <div class="score-container" id="percussionScore"></div>
      `;
      container.appendChild(scoreItem);

      try {
        const osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay("percussionScore", {
          autoResize: true,
          backend: "svg",
          disableCursor: true,
          drawingParameters: "default",
          newSystemFromXML: true,
          renderSingleHorizontalStaffline: false,
          drawPartNames: false,
          drawTitle: false,
          drawComposer: false,
          autoBeam: false,
          pageFormat: "Endless"
        });

        // Установка параметров для перкуссии
        osmd.EngravingRules.RenderXMeasuresPerLineAkaSystem = 4;
        osmd.EngravingRules.StaffHeight = 3.2;
        osmd.EngravingRules.BetweenStaffDistance = 7;
        osmd.EngravingRules.PercussionOneLineCutoff = -1;
        osmd.EngravingRules.PercussionForceVoicesOneLineCutoff = -1;
        osmd.EngravingRules.PercussionUseXMLDisplayStep = true;

        // Замените на путь к вашему перкуссионному MusicXML-файлу
        await osmd.load("/lessons/percussion_example.xml");
        await osmd.render();
        osmd.zoom = 0.95;
      } catch (err) {
        console.error("Ошибка загрузки партитуры:", err);
        document.getElementById('percussionScore').innerHTML = `
          <div style="padding:20px; color:#e53e3e; text-align:center;">
            Не удалось загрузить партитуру.
          </div>
        `;
      }
    }

    // Загружаем при старте
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', loadPercussionScore);
    } else {
      loadPercussionScore();
    }
  </script>
