<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Хэндпан D Celtic</title>
  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="stylesheet" type="text/css" href="../main.min.css?v=14">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <style>
    .hang-container {
      position: relative;
      width: 420px;
      height: 420px;
      margin: 20px auto;
    }
    .center-zone,
    .note-zone {
      position: absolute;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 50%;
      cursor: pointer;
      font-weight: bold;
      color: #5c4033;
      user-select: none;
    }
    .center-zone {
      width: 100px;
      height: 100px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #d2b48c;
      z-index: 10;
    }
    .note-zone {
      width: 84px;
      height: 84px;
      background: #e0c7a3;
    }
    .zone-number {
      font-size: 24px;
      line-height: 1.1;
    }
    .note-name {
      font-size: 12px;
      opacity: 0.6;
      margin-top: 2px;
    }
    @media (max-width: 768px) {
      .hang-container { width: 320px; height: 320px; }
      .note-zone { width: 64px; height: 64px; }
      .center-zone { width: 80px; height: 80px; }
      .zone-number { font-size: 20px; }
    }
  </style>
</head>
<body>

<div id="hdrum-vidget">
  <!-- Клавиатурная подсказка (скрыта, но нужна для работы) -->
  <dl class="hd-controls hd-notes" style="display:none;">
    <div class="hd-note" data-petal="0"><dt>A</dt><dd>D1</dd></div>
    <div class="hd-note" data-petal="1"><dt>S</dt><dd>A1</dd></div>
    <div class="hd-note" data-petal="2"><dt>D</dt><dd>C1</dd></div>
    <div class="hd-note" data-petal="3"><dt>F</dt><dd>D2</dd></div>
    <div class="hd-note" data-petal="4"><dt>G</dt><dd>E</dd></div>
    <div class="hd-note" data-petal="5"><dt>H</dt><dd>F</dd></div>
    <div class="hd-note" data-petal="6"><dt>J</dt><dd>G</dd></div>
    <div class="hd-note" data-petal="7"><dt>K</dt><dd>A2</dd></div>
    <div class="hd-note" data-petal="8"><dt>L</dt><dd>C2</dd></div>
  </dl>

  <div class="hd-controls hd-main">
    <!-- Кнопка "Гамма" — УДАЛЯЕМ или скрываем -->
    <!-- <button class="hd-gamma">...</button> -->

    <div class="hd-drum">
      <div class="hang-container" id="hang">
        <div class="center-zone" data-petal="0">
          <div class="zone-number">0</div>
          <div class="note-name">D1</div>
        </div>
        <!-- Зоны будут добавлены скриптом -->
      </div>
      <!-- Теги можно оставить или убрать — не влияют -->
    </div>

    <button class="hd-tuk" data-petal="0" style="display:none;">тук</button>
  </div>

  <div class="hd-controls hd-bottom">
    <button class="hd-share">
      <svg xmlns="http://www.w3.org/2000/svg" width="51" height="51" fill="none">
        <path d="M21.3463 16.646L26.071 11.9213L30.7957 16.646" stroke="var(--color)" stroke-width="2.4382" stroke-linecap="round" />
        <path d="M25.972 12.1787V27.8551" stroke="var(--color)" stroke-width="2.4382" stroke-linecap="round" />
        <path fill-rule="evenodd" clip-rule="evenodd"
          d="M22.8883 19.6572C20.004 19.9335 17.7484 22.3635 17.7484 25.3202V30.3893C17.7484 33.5313 20.2955 36.0784 23.4376 36.0784H28.5066C31.6487 36.0784 34.1958 33.5313 34.1958 30.3893V25.3202C34.1958 22.3635 31.9403 19.9336 29.056 19.6572V22.1155C30.5898 22.3765 31.7576 23.712 31.7576 25.3202V30.3893C31.7576 32.1847 30.3021 33.6402 28.5066 33.6402H23.4376C21.6421 33.6402 20.1866 32.1847 20.1866 30.3893V25.3202C20.1866 23.712 21.3544 22.3765 22.8883 22.1155V19.6572Z"
          fill="var(--color)" />
      </svg>
    </button>

    <button class="hd-rec-play hd-rec hd-visible">
      <svg width="51" height="51">
        <rect x="20.3931" y="10.6997" width="10.5002" height="21.0003" rx="5.25008" fill="var(--color)" />
        <path d="M17.562 26.4503C17.562 28.5935 18.4134 30.649 19.9289 32.1645C21.4444 33.68 23.4998 34.5314 25.6431 34.5314C27.7863 34.5314 29.8417 33.68 31.3572 32.1645C32.8727 30.649 33.7241 28.5935 33.7241 26.4503"
          stroke="currentColor" stroke-width="2.16191" fill="none" />
        <path d="M25.6431 35.8906V44.7722" stroke="var(--color)" stroke-width="2.4382" stroke-linecap="round" />
        <rect x="15" y="15" width="21" height="21" rx="5.68914" fill="var(--color)" />
      </svg>
    </button>

    <div class="hd-player">
      <button class="hd-rec-play hd-play">
        <svg width="51" height="51">
          <path id="playpath"
            d="M 36.062 22.853 C 38.113 24.03 38.113 26.97 36.062 28.147 L 22.216 36.086 C 20.165 37.262 17.6 35.792 17.6 33.44 L 17.6 17.56 C 17.6 15.208 20.165 13.738 22.216 14.914 L 36.062 22.853 Z"
            fill="var(--color)" />
          <rect x="15" y="15" width="21" height="21" rx="5.68914" fill="var(--color)" />
        </svg>
      </button>
      <div class="hd-timeline">
        <input type="range" min="0" max="1000" value="0" />
      </div>
    </div>

    <button class="hd-close">
      <svg xmlns="http://www.w3.org/2000/svg" width="51" height="51" fill="none">
        <path d="M18.4064 18.5356L32.595 32.7243 M18.4064 32.7241L32.595 18.5355" stroke="var(--color)" stroke-width="2.4382" stroke-linecap="round" />
      </svg>
    </button>
  </div>
</div>

<script type="module">
  // === Подключаем логику глюкофона ===
  import './hang.min.js';
</script>

<script>
  // === Создаём зоны ханга ===
  document.addEventListener('DOMContentLoaded', () => {
    const hang = document.getElementById('hang');
    const size = hang.clientWidth;
    const radius = size * 0.333;
    const noteSize = size <= 320 ? 64 : 84;

    const layout = [
      { petal: 8, angle: 0   },   // север
      { petal: 7, angle: 45  },   // северо-восток
      { petal: 5, angle: 90  },   // восток
      { petal: 3, angle: 135 },   // юго-восток
      { petal: 1, angle: 180 },   // юг
      { petal: 2, angle: 225 },   // юго-запад
      { petal: 4, angle: 270 },   // запад
      { petal: 6, angle: 315 }    // северо-запад
    ];

    layout.forEach(zone => {
      const angleRad = (zone.angle - 90) * Math.PI / 180;
      const x = radius * Math.cos(angleRad) + (size - noteSize) / 2;
      const y = radius * Math.sin(angleRad) + (size - noteSize) / 2;

      const el = document.createElement('div');
      el.className = 'note-zone';
      el.dataset.petal = zone.petal;
      el.innerHTML = `<div class="zone-number">${zone.petal}</div>`;
      el.style.width = `${noteSize}px`;
      el.style.height = `${noteSize}px`;
      el.style.left = `${x}px`;
      el.style.top = `${y}px`;
      hang.appendChild(el);
    });
  });
</script>

</body>
</html>
