  <style>
   * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

body {
  background: #1a1a1a;
  color: #fff;
  padding: 16px;
  max-width: 600px;
  margin: 0 auto;
}

h1 {
  text-align: center;
  margin: 16px 0 24px;
  font-size: 24px;
  color: #666;
}

.song {
  background: #2a2a2a;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}

.song-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
  user-select: none;
}

.song-title {
  font-size: 18px;
  font-weight: 600;
  flex: 1;
}

.song-meta {
  display: flex;
  gap: 16px;
  font-size: 14px;
  color: #aaa;
  min-width: max-content;
}

.song-bpm, .song-key {
  text-align: right;
}

.toggle-icon {
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #666;
  transition: transform 0.3s;
}

.toggle-icon.open {
  transform: rotate(90deg);
  color: #fff;
}

.song-details {
  display: none;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid #3a3a3a;
}

.song-details.open {
  display: block;
}

.structure {
  display: flex;
  gap: 4px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}

.structure-block {
  flex: 1;
  min-width: 40px;
  height: 40px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.2s;
  position: relative;
}

.structure-block:hover {
  opacity: 0.8;
  transform: translateY(-2px);
}

.structure-block::after {
  content: attr(data-time);
  position: absolute;
  bottom: -18px;
  font-size: 9px;
  color: #888;
}

/* Цвета блоков */
.intro    { background: #FF6B6B; color: #fff; }    /* Красный */
.verse    { background: #4ECDC4; color: #1a1a1a; } /* Бирюзовый */
.chorus   { background: #45B7D1; color: #fff; }    /* Синий */
.bridge   { background: #FFA500; color: #fff; }    /* Оранжевый */
.solo     { background: #FFD700; color: #1a1a1a; } /* Жёлтый */
.outro    { background: #888; color: #fff; }       /* Серый */
.prechorus{ background: #98D8C8; color: #1a1a1a; } /* Светло-бирюзовый */
.mod      { background: #FF6B6B; color: #fff; }    /* Красный */

.player {
  width: 100%;
  margin-top: 8px;
}

.legend {
  background: #252525;
  border-radius: 8px;
  padding: 12px;
  margin-bottom: 16px;
  font-size: 12px;
  color: #888;
}

.legend-item {
  display: inline-block;
  margin-right: 12px;
  margin-bottom: 4px;
}

.legend-color {
  display: inline-block;
  width: 12px;
  height: 12px;
  border-radius: 3px;
  margin-right: 4px;
  vertical-align: middle;
}

.order-number {
  color: #FF6B6B;
  font-weight: bold;
  margin-right: 8px;
}

/* Стили для схемы вступления */
.intro-scheme {
  margin-top: 10px;
  padding: 15px;
  background: rgba(51, 51, 51, 0.8);
  border-radius: 8px;
  border: 1px solid #555;
}

.measures-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 3px;
  margin-bottom: 10px;
}

.measure-cell {
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  border-radius: 4px;
  color: #fff;
  min-width: 0;
  padding: 0 2px;
  text-align: center;
  border: 2px solid #fff;
  background: transparent;
  backdrop-filter: blur(10px);
  transition: background 0.2s ease; /* Плавный переход */
}

/* Активные ссылки будут светлее при hover */
.measure-cell[href]:hover {
  background: rgba(255, 255, 255, 0.2) !important;
}

.measure-cell.empty {
  border: 2px solid transparent;
  background: transparent;
  visibility: hidden;
}


.measure-cell:hover {
  background: rgba(255, 255, 255, 0.1);
}

.instrument-label {
  font-size: 9px;
  color: #aaa;
  margin-top: 15px;
}

      if (details.classList.contains('open')) {
        details.classList.remove('open');
        icon.classList.remove('open');
      } else {
        // Закрываем все остальные
        document.querySelectorAll('.song-details').forEach(el => el.classList.remove('open'));
        document.querySelectorAll('.toggle-icon').forEach(el => el.classList.remove('open'));
        
        // Открываем текущий
        details.classList.add('open');
        icon.classList.add('open');
      }
    };

      }

// Показ схемы вступления с 8-колоночной сеткой
window.showIntroScheme = function(songIndex) {
  const song = songs[songIndex];
  if (!song || !song.introScheme) return;

  // Удаляем предыдущую схему, если была
  let existingScheme = document.querySelector(`#scheme-${songIndex}`);
  if (existingScheme) existingScheme.remove();

  const container = document.createElement('div');
  container.id = `scheme-${songIndex}`;
  container.className = 'intro-scheme';
  container.innerHTML = '<h4 style="margin-bottom: 8px; color: #FF6B6B;">Схема вступления:</h4>';

  // Создаем сетку для каждой строки
  song.introScheme.forEach((line, lineIndex) => {
    const grid = document.createElement('div');
    grid.className = 'measures-grid';
    
    let currentPosition = 0;
    
    // Добавляем ячейки для каждого элемента в строке
    line.forEach(item => {
      // Создаем ССЫЛКУ вместо div
      const cell = document.createElement('a');
      cell.className = 'measure-cell';
      cell.textContent = getInstrumentShortName(item);
      cell.style.gridColumn = `span ${item.duration}`;
      
      // Стили для ссылки
      cell.style.textDecoration = 'none';
      cell.style.display = 'flex';
      cell.style.alignItems = 'center';
      cell.style.justifyContent = 'center';
      cell.style.cursor = 'pointer';
      
      // Делаем ссылку на редактор нот (если указан URL)
      if (item.editorUrl) {
        cell.href = item.editorUrl;
        cell.target = '_blank'; // Открываем в новой вкладке
      } else {
        cell.href = 'javascript:void(0)'; // Пустая ссылка
        cell.style.cursor = 'default'; // Обычный курсор для неактивных
      }

      // Hover-эффект для активных ссылок
      if (item.editorUrl) {
        cell.addEventListener('mouseenter', () => {
          cell.style.background = 'rgba(255, 255, 255, 0.2)';
        });

        cell.addEventListener('mouseleave', () => {
          cell.style.background = 'transparent';
        });
      }
      
      grid.appendChild(cell);
      currentPosition += item.duration;
    });
    
    // Добавляем пустые ячейки если нужно до 8
    while (currentPosition < 8) {
      const emptyCell = document.createElement('div');
      emptyCell.className = 'measure-cell empty';
      grid.appendChild(emptyCell);
      currentPosition++;
    }
    
    container.appendChild(grid);
  });

  // Вставляем после плеера
  const playerContainer = document.getElementById(`details-${songIndex}`);
  playerContainer.appendChild(container);
};


function getInstrumentShortName(item) {
  if (item.label) {
    return item.label;  // Используем готовую метку
  }
  
  // Для обратной совместимости с одиночными инструментами
  switch(item.instrument) {
    case 'drums': return '🥁';
    case 'bass': return '🎸';
    case 'keys': return '🎹';
    case 'guitar': return '🎸';
    case 'vocals': return '🎤';
    case 'all': return '🎶';
    default: return '🎵';
  }
}
