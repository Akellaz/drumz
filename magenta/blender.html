<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест Firestore - drumz.ru</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
        button { padding: 12px 24px; font-size: 16px; cursor: pointer; background: #039be5; color: white; border: none; border-radius: 4px; margin-right: 10px; }
        button:hover { background: #0277bd; }
        button.secondary { background: #5f6368; }
        button.secondary:hover { background: #3c4043; }
        #status { margin-top: 20px; font-weight: bold; }
        .user-card { background: #f1f3f4; padding: 15px; border-radius: 8px; margin-top: 10px; border-left: 4px solid #039be5; }
    </style>
</head>
<body>
    <h2>Управление пользователями (Firestore)</h2>
    
    <button id="addUserBtn">Добавить пользователя</button>
    <button id="loadUsersBtn" class="secondary">Обновить список</button>
    
    <p id="status"></p>
    <div id="usersList"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, serverTimestamp, orderBy, query } 
        from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCb4mcornYDLKr36cfW8oGQtd_NE4Ktjd4",
            authDomain: "drumz-c9989.firebaseapp.com",
            projectId: "drumz-c9989",
            storageBucket: "drumz-c9989.firebasestorage.app",
            messagingSenderId: "51187561111",
            appId: "1:51187561111:web:4c24867e255f2165592fd2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const usersCollection = collection(db, "users");

        const statusEl = document.getElementById('status');
        const usersListEl = document.getElementById('usersList');

        // Функция добавления
        document.getElementById('addUserBtn').addEventListener('click', async () => {
            statusEl.textContent = "⏳ Добавление...";
            try {
                await addDoc(usersCollection, {
                    name: "Сергей Щепотин",
                    role: "admin",
                    createdAt: serverTimestamp()
                });
                statusEl.textContent = "✅ Успешно добавлено!";
                statusEl.style.color = "green";
                loadUsers(); // Сразу обновляем список
            } catch (e) {
                statusEl.textContent = "❌ Ошибка: " + e.message;
                statusEl.style.color = "red";
            }
        });

        // Функция чтения
        document.getElementById('loadUsersBtn').addEventListener('click', loadUsers);

        async function loadUsers() {
            statusEl.textContent = "⏳ Загрузка...";
            usersListEl.innerHTML = "";
            try {
                // Запрашиваем все документы из коллекции users
                const querySnapshot = await getDocs(usersCollection);
                
                if (querySnapshot.empty) {
                    statusEl.textContent = "База пуста.";
                    return;
                }

                statusEl.textContent = `✅ Загружено записей: ${querySnapshot.size}`;
                statusEl.style.color = "green";

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const date = data.createdAt ? new Date(data.createdAt.seconds * 1000).toLocaleString('ru-RU') : 'Нет даты';
                    
                    const card = document.createElement('div');
                    card.className = 'user-card';
                    card.innerHTML = `
                        <strong>Имя:</strong> ${data.name || 'Не указано'}<br>
                        <strong>Роль:</strong> ${data.role || 'Не указана'}<br>
                        <strong>ID:</strong> <small>${doc.id}</small><br>
                        <strong>Создан:</strong> <small>${date}</small>
                    `;
                    usersListEl.appendChild(card);
                });
            } catch (e) {
                statusEl.textContent = "❌ Ошибка чтения: " + e.message;
                statusEl.style.color = "red";
            }
        }

        // Загружаем список при открытии страницы
        loadUsers();
    </script>
</body>
</html>
