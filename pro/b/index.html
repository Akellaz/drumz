<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Прогресс учеников • drumz.ru</title>
  <style>
    :root {
      --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --muted: #64748b;
      --accent: #10b981; --completed: #22c55e; --in-progress: #f59e0b; --locked: #cbd5e1;
      --border: #e2e8f0; --shadow: 0 1px 2px rgba(0,0,0,0.06);
      --video-bg: #dcfce7; --video-text: #166534; --video-border: #86efac;
      --notation-bg: #ede9fe; --notation-text: #5b21b6; --notation-border: #c4b5fd;
      --star: #fbbf24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.3; padding: 0.75rem; max-width: 100%; margin: 0 auto; font-size: 0.9rem; }
    h1 { font-size: 1.25rem; font-weight: 700; margin: 0 0 0.75rem; padding: 0.5rem 0.25rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 0.5rem; }
    .student-card { background: var(--card); padding: 0.75rem; border-radius: 8px; cursor: pointer; border: 1px solid var(--border); box-shadow: var(--shadow); transition: border-color 0.15s; }
    .student-card:hover { border-color: var(--accent); }
    .student-header { display:flex; justify-content:space-between; align-items:center; gap:0.3rem; }
    .student-name { font-weight: 600; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .student-stars { font-size: 0.8rem; color: var(--muted); white-space: nowrap; }
    .student-stars .star-icon { color: var(--star); margin-right: 2px; }
    
    #progress-view { display: none; }
    .back-btn { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 0.3rem 0.7rem; border-radius: 6px; cursor: pointer; margin: 0 0 0.75rem; font-weight: 500; font-size: 0.85rem; transition: border-color 0.15s; text-decoration: none; display: inline-flex; align-items: center; }
    .back-btn:hover { border-color: var(--accent); color: var(--accent); }
    .share-btn { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 0.2rem 0.5rem; border-radius: 4px; cursor: pointer; font-size: 0.8rem; margin-left: 0.3rem; transition: border-color 0.15s; vertical-align: middle; }
    .share-btn:hover { border-color: var(--accent); color: var(--accent); }
    .level { background: var(--card); border-radius: 10px; padding: 0.75rem; margin-bottom: 0.75rem; border: 1px solid var(--border); box-shadow: var(--shadow); }
    .level-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem; margin-bottom: 0.4rem; }
    .level-title { font-weight: 700; font-size: 1rem; }
    .level-desc { color: var(--muted); font-size: 0.8rem; margin-bottom: 0.5rem; }
    .items { display: grid; gap: 0.35rem; }
    .item { display: grid; grid-template-columns: 1fr auto; gap: 0.4rem; padding: 0.5rem 0.6rem; background: #f8fafc; border-radius: 6px; align-items: center; border-left: 2px solid var(--border); font-size: 0.85rem; }
    .item:hover { background: #f1f5f9; }
    .item.completed { border-left-color: var(--completed); }
    .item.in_progress { border-left-color: var(--in-progress); }
    .item.locked { opacity: 0.7; background: #f8fafc; }
    .item-main { min-width: 0; }
    .item-name { font-weight: 600; margin-bottom: 0.1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-date { color: var(--muted); font-size: 0.7rem; }
    .item-actions { display: flex; gap: 0.3rem; margin-top: 0.2rem; flex-wrap: wrap; }
    .action-btn { display: inline-flex; align-items: center; gap: 0.2rem; padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: 500; text-decoration: none; transition: background 0.15s; white-space: nowrap; border: 1px solid; }
    .action-btn.video { background: var(--video-bg); color: var(--video-text); border-color: var(--video-border); }
    .action-btn.video:hover { background: #bbf7d0; }
    .action-btn.notation { background: var(--notation-bg); color: var(--notation-text); border-color: var(--notation-border); }
    .action-btn.notation:hover { background: #ddd6fe; }
    .item-status { padding: 0.15rem 0.4rem; border-radius: 4px; font-size: 0.7rem; font-weight: 500; white-space: nowrap; align-self: center; }
    .item.completed .item-status { background: #dcfce7; color: #166534; }
    .item.in_progress .item-status { background: #fef3c7; color: #92400e; }
    .item.not_started .item-status { background: #f1f5f9; color: #64748b; }
    .item.locked .item-status { background: #e2e8f0; color: #475569; }
    .item-rating { margin-top: 0.25rem; font-size: 0.85rem; letter-spacing: 1px; }
    .empty, .loading { text-align: center; color: var(--muted); padding: 2rem 0; font-size: 0.9rem; }
    .error { text-align: center; color: #dc2626; padding: 2rem 0; font-size: 0.9rem; background: #fef2f2; border-radius: 8px; margin: 1rem 0; }
    footer { text-align: center; margin-top: 1.5rem; color: var(--muted); font-size: 0.75rem; padding: 1rem 0; }
    
    #filters { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.5rem 0; padding: 0.5rem; background: var(--card); border-radius: 8px; border: 1px solid var(--border); }
    #filters select, #filters button { font-size: 0.8rem; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border); background: #f8fafc; cursor: pointer; }
    #filters button.reset { background: #fee2e2; color: #991b1b; border-color: #fca5a5; }
    #filters button.reset:hover { background: #fecaca; }
    
    @media (max-width: 480px) {
      .item { grid-template-columns: 1fr; align-items: start; }
      .item-status { justify-self: start; margin-top: 0.2rem; }
      .grid { grid-template-columns: 1fr; }
      .level-header { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <h1>🥁 Ученики</h1>

  <div id="filters" style="display:none">
    <select id="filter-rhythm" data-cat="rhythm">
      <option value="">Ритм: все</option>
      <option value="четверти">Четверти</option>
      <option value="восьмые">Восьмые</option>
      <option value="шестнадцатые">Шестнадцатые</option>
    </select>
    <select id="filter-difficulty" data-cat="difficulty">
      <option value="">Сложность: все</option>
      <option value="easy">Easy</option>
      <option value="medium">Medium</option>
      <option value="hard">Hard</option>
    </select>
    <select id="filter-tempo" data-cat="tempo">
      <option value="">Темп: все</option>
      <option value="80">80 BPM</option>
      <option value="100">100 BPM</option>
      <option value="120">120 BPM</option>
      <option value="140">140 BPM</option>
      <option value="160">160 BPM</option>
      <option value="180">180 BPM</option>
      <option value="200">200 BPM</option>
      <option value="200+">200+ BPM</option>
    </select>
    <select id="filter-type" data-cat="type">
      <option value="">Тип: все</option>
      <option value="песня">Песня</option>
      <option value="фрагмент">Фрагмент</option>
      <option value="интро">Интро</option>
    </select>
    <button class="reset" onclick="resetFilters()">✕ Сброс</button>
  </div>

  <div id="loading" class="loading">Загрузка...</div>
  <div id="error-msg" class="error" style="display:none;"></div>
  <div id="student-list" class="grid" style="display:none;"></div>
  
  <div id="progress-view">
    <a href="./" class="back-btn">← Назад</a>
    <span id="view-name" style="font-size:1.1rem; font-weight:600; vertical-align: middle;"></span>
    <button class="share-btn" onclick="shareLink()">🔗</button>
    <div id="progress-content" style="margin-top:0.75rem;"></div>
  </div>
  
  <footer><a href="https://drumz.ru/">drumz.ru</a></footer>

  <script>
    const API_BASE = 'api.php';
    const urlParams = new URLSearchParams(window.location.search);
    const studentParam = urlParams.get('student');
    
    let curriculum = null;
    let studentsData = null;
    let currentStudentId = null;
    let currentStudentName = null;

    async function apiRequest(action, student = null) {
      const url = `${API_BASE}?action=${action}${student ? `&student=${encodeURIComponent(student)}` : ''}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      return data;
    }

    function renderItemStars(rating) {
      if (rating == null) return '';
      return `<span style="color:var(--star)">${'⭐'.repeat(rating)}${'☆'.repeat(5 - rating)}</span>`;
    }

    async function init() {
      const container = document.getElementById('student-list');
      const loading = document.getElementById('loading');
      const errorMsg = document.getElementById('error-msg');

      document.querySelectorAll('#filters select').forEach(s => s.addEventListener('change', applyFilters));

      try {
        [curriculum, studentsData] = await Promise.all([
          apiRequest('curriculum'),
          apiRequest('students')
        ]);
        
        if (studentParam) {
          const target = studentsData.find(s => s.id == studentParam);
          if (target) {
            loading.style.display = 'none';
            document.getElementById('student-list').style.display = 'none';
            document.getElementById('progress-view').style.display = 'block';
            document.getElementById('view-name').textContent = target.name;
            showFilters(true);
            currentStudentId = target.id;
            currentStudentName = target.name;
            await loadStudentProgress(target.id, target.name);
            return;
          }
        }
        
        loading.style.display = 'none';
        container.style.display = 'grid';
        showFilters(false);
        
        if (studentsData.length === 0) {
          container.innerHTML = '<div class="empty">Нет данных об учениках</div>';
        } else {
          // Сортировка по сумме звёзд (убывание)
          studentsData.sort((a, b) => (b.total_stars || 0) - (a.total_stars || 0));
          studentsData.forEach(s => renderStudentCard(s, container));
        }
        
      } catch (e) {
        loading.style.display = 'none';
        errorMsg.textContent = `Ошибка: ${e.message}. Проверьте подключение к базе данных.`;
        errorMsg.style.display = 'block';
        console.error('Init error:', e);
      }
    }

    function renderStudentCard(s, container) {
      const card = document.createElement('div');
      card.className = 'student-card';
      const starsDisplay = s.total_stars > 0 
        ? `<span class="student-stars"><span class="star-icon">⭐</span>${s.total_stars}</span>` 
        : '';
      card.innerHTML = `
        <div class="student-header">
          <div class="student-name" title="${escapeHtml(s.name)}">${escapeHtml(s.name)}</div>
          ${starsDisplay}
        </div>
      `;
      card.onclick = () => loadStudentProgress(s.id, s.name);
      container.appendChild(card);
    }

    async function loadStudentProgress(studentId, name) {
      const u = new URL(window.location); 
      u.searchParams.set('student', studentId); 
      window.history.replaceState({}, '', u);
      
      document.getElementById('student-list').style.display = 'none';
      document.getElementById('progress-view').style.display = 'block';
      document.getElementById('view-name').textContent = name;
      showFilters(true);
      currentStudentId = studentId;
      currentStudentName = name;
      document.getElementById('progress-content').innerHTML = '<div class="loading">Загрузка прогресса...</div>';

      try {
        const progress = await apiRequest('progress', studentId);
        renderProgress(progress);
      } catch (e) {
        document.getElementById('progress-content').innerHTML = `<div class="empty">Не удалось загрузить прогресс: ${e.message}</div>`;
      }
    }

    function shareLink() {
      navigator.clipboard.writeText(window.location.href).then(() => {
        const btn = document.querySelector('.share-btn'); 
        const orig = btn.textContent;
        btn.textContent = '✓ Скопировано'; 
        setTimeout(() => btn.textContent = orig, 1500);
      }).catch(() => {
        prompt('Скопируйте ссылку:', window.location.href);
      });
    }

    function showFilters(show) {
      document.getElementById('filters').style.display = show ? 'flex' : 'none';
    }

    function renderItem(item, prog, isUnlocked) {
      let status = prog?.status || (isUnlocked ? 'not_started' : 'locked');
      if (!isUnlocked && status !== 'completed') status = 'locked';
      
      const statusMap = { completed:'✅', in_progress:'🔄', not_started:'⏳', locked:'🔒' };
      const cls = `item ${status}`;
      const tagsAttr = (item.tags || []).join(',');
      
      if (status === 'locked') {
        return `<div class="${cls}" data-tags="${tagsAttr}" data-item-id="${item.id}">
          <div class="item-main"><div class="item-name" title="${escapeHtml(item.name)}">${escapeHtml(item.name)}</div></div>
          <div class="item-status">${statusMap[status]}</div>
        </div>`;
      }
      
      const date = prog?.date_completed ? new Date(prog.date_completed).toLocaleDateString('ru-RU',{day:'numeric',month:'short'}) : '';
      const ratingHtml = prog?.rating != null ? `<div class="item-rating">${renderItemStars(prog.rating)}</div>` : '';
      
      return `<div class="${cls}" data-tags="${tagsAttr}" data-item-id="${item.id}">
        <div class="item-main">
          <div class="item-name" title="${escapeHtml(item.name)}">${escapeHtml(item.name)}</div>
          ${date ? `<div class="item-date">Завершено: ${date}</div>` : ''}
          <div class="item-actions">
            ${prog?.video && status==='completed' ? `<a href="${escapeHtml(prog.video)}" target="_blank" rel="noopener" class="action-btn video">▶️ Видео</a>`:''}
            ${item.notation ? `<a href="${escapeHtml(item.notation)}" target="_blank" rel="noopener" class="action-btn notation">🎼 Ноты</a>`:''}
          </div>
          ${ratingHtml}
        </div>
        <div class="item-status">${statusMap[status]}</div>
      </div>`;
    }

    function renderProgress(progress) {
      const container = document.getElementById('progress-content');
      container.innerHTML = '';
      curriculum.levels.forEach(level => {
        const isUnlocked = !level.unlock_condition || checkUnlock(progress, level.unlock_condition);
        const el = document.createElement('div');
        el.className = 'level';
        el.innerHTML = `
          <div class="level-header">
            <div><div class="level-title">${escapeHtml(level.name)}</div>${level.description ? `<div class="level-desc">${escapeHtml(level.description)}</div>` : ''}</div>
            <div style="text-align:right;font-size:0.8rem;color:var(--muted)">${!isUnlocked ? '🔒' : ''}</div>
          </div>
          <div class="items">${level.items.map(item => renderItem(item, progress[item.id], isUnlocked)).join('')}</div>
        `;
        container.appendChild(el);
      });
    }

    function applyFilters() {
      const active = {};
      ['rhythm','difficulty','tempo','type'].forEach(cat => {
        const sel = document.getElementById(`filter-${cat}`);
        if (sel?.value) active[cat] = sel.value;
      });
      document.querySelectorAll('.item').forEach(el => {
        const tags = (el.dataset.tags || '').split(',').filter(Boolean);
        const match = Object.entries(active).every(([cat, val]) => {
          if (cat === 'tempo') return val === '200+' ? tags.some(t => /^\d+$/.test(t) && parseInt(t) >= 200) : tags.includes(val);
          return tags.includes(val);
        });
        el.style.display = match ? '' : 'none';
      });
    }

    function resetFilters() {
      document.querySelectorAll('#filters select').forEach(s => s.value = '');
      document.querySelectorAll('.item').forEach(el => el.style.display = '');
    }

    function checkUnlock(progress, condition) {
      if (!condition) return true;
      const [levelId, reqStr] = condition.split(':');
      const req = parseInt(reqStr);
      const lvl = curriculum.levels.find(l => l.id === levelId);
      if (!lvl) return false;
      let total = 0, done = 0;
      lvl.items.forEach(item => {
        const p = progress[item.id] || { status: 'not_started' };
        if (p.status !== 'locked') total++;
        if (p.status === 'completed') done++;
      });
      return total === 0 ? false : Math.round((done / total) * 100) >= req;
    }

    function escapeHtml(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
