  <script>
    // === Вставка текста в textarea в позицию курсора ===
    function insertAtCursor(textarea, text) {
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      const before = textarea.value.substring(0, start);
      const after = textarea.value.substring(end);
      textarea.value = before + text + after;
      const newCursorPos = start + text.length;
      textarea.setSelectionRange(newCursorPos, newCursorPos);
      textarea.focus();
    }

    // === Resizer ===
    const resizer = document.getElementById("resizer");
    const sidebar = document.querySelector(".sidebar");

    resizer.addEventListener("mousedown", (e) => {
      document.addEventListener("mousemove", resize);
      document.addEventListener("mouseup", stopResize);
      e.preventDefault();
    });

    function resize(e) {
      const containerRect = document.querySelector(".container").getBoundingClientRect();
      const newWidth = e.clientX - containerRect.left;
      if (newWidth > 100 && newWidth < containerRect.width - 200) {
        sidebar.style.width = newWidth + "px";
      }
    }

    function stopResize() {
      document.removeEventListener("mousemove", resize);
      document.removeEventListener("mouseup", stopResize);
    }

    // === Группы нот ===
	
    const noteGroups = {
      basic: [
        { note: "c4", label: "c4", title: "Четверть" },
        { note: "c2", label: "с2", title: "Восьмая" },
        { note: "c2c2", label: "c2c2", title: "Восьмушки" },
        { note: "cccc", label: "cccc", title: "Шестнадцатые" },
		{ note: "c16 |", label: "c16", title: "Целая" },
		{ note: "c8", label: "c8", title: "Половинная" }
      ],
      pauses: [
        { note: "z16 |", label: "z16", title: "Целая пауза" },
        { note: "z8", label: "z8", title: "Половинная пауза" },
        { note: "z4", label: "z4", title: "Четвертная пауза" },
        { note: "z2", label: "z2", title: "Восьмая пауза" }
      ],
      syncop: [
		{ note: "c6", label: "c6", title: "Четверть с точкой" },
        { note: "c3c", label: "c3c", title: "Восьмая с точкой + шестнадцатая" },
		{ note: "cc2c", label: "cc2c", title: "Шестнадцатая + восьмая + шестнадцатая" },
		{ note: "z2c2", label: "z2c2", title: "Восьмая пауза+нота" }

      ],
	  triplets: [
        { note: "(3c2c2c2", label: "(3c2c2c2", title: "Восьмая триоль" },
		{ note: "(3c2z2c2", label: "(3c2z2c2", title: "Триоль пауза триоль" },
		{ note: "(3z2c2z2", label: "(3z2c2z2", title: "Пауза триоль пауза" },
		{ note: "(3c4c4c4", label: "(3c4c4c4", title: "Четвертная триоль" }

      ],
	  sextuplets: [
        { note: "(3ccc(3ccc", label: "(3ccc(3ccc", title: "Секстоль" },
		{ note: "c2(3ccc", label: "c2(3ccc", title: "Восьмая + секстоль" },
		{ note: "(3cccc2", label: "(3cccc2", title: "Секстоль + восьмая" },
		

      ],
	  sixteens: [
	    { note: "c2cc", label: "c2cc", title: "Галоп" },
        { note: "ccc2", label: "ccc2", title: "Обратный галоп" },
        { note: "zccc", label: "zccc", title: "1/16 пауза+шестнадцатые" },
        { note: "z2cc", label: "z2cc", title: "Восьмая пауза+шестнадцатые" }

        
      ],
      complex: [
        { note: "[F4g]", label: "[F4g]", title: "Бочка+хэт четверть" },
		{ note: "[c4g]", label: "[c4g]", title: "Малый+хэт четверть" },
		
		{ note: "[F2g2]g2", label: "[F2g2]g2", title: "[Бочка хэт]+хэт восьмые" },
		{ note: "[c2g2]g2", label: "[c2g2]g2", title: "[Малый хэт]+хэт восьмые" },
        { note: "g2[F2g2]", label: "g2[F2g2]", title: "Хэт+[бочка хэт] восьмые" }
		
		
		
      ],
	  separator: [
        { note: "|", label: "|", title: "Тактовая черта" }
      ]
    };

    const activeGroups = new Set();
    const activeNoteButtons = document.getElementById("active-note-buttons");
    const groupButtons = document.querySelectorAll(".group-btn");

    // === Обработка кликов по группам ===
    groupButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        const groupKey = btn.dataset.group;
        const isActive = activeGroups.has(groupKey);

        if (isActive) {
          // Удаляем все кнопки этой группы
          Array.from(activeNoteButtons.children).forEach(child => {
            if (child.dataset.group === groupKey) {
              activeNoteButtons.removeChild(child);
            }
          });
          activeGroups.delete(groupKey);
          btn.classList.remove("active");
        } else {
          // Добавляем кнопки группы
          noteGroups[groupKey].forEach(item => {
            const button = document.createElement("button");
            button.className = "note-btn";
            button.dataset.note = item.note;
            button.dataset.group = groupKey;
            button.title = item.title;
            button.textContent = item.label;
            activeNoteButtons.appendChild(button);
          });
          activeGroups.add(groupKey);
          btn.classList.add("active");
        }
      });
    });

    // === ABCJS Core ===
    let synthControl = null;
    let visualObj = null;
    let abcString = document.getElementById("abc").value;
    const abcTextarea = document.getElementById("abc");
    const paperDiv = document.getElementById("paper");
    const audioDiv = document.getElementById("audio-controls");
    const showCursor = document.getElementById("show-cursor");
    const renderBtn = document.getElementById("renderBtn");
    const fragmentList = document.getElementById("fragment-list");
    const addFragmentBtn = document.getElementById("add-fragment");
    const deleteFragmentBtn = document.getElementById("delete-fragment");
    const saveProjectBtn = document.getElementById("save-project");
    const loadProjectBtn = document.getElementById("load-project");
    const fileInput = document.getElementById("file-input");
    const projectTitle = document.getElementById("project-title");
    const projectTempo = document.getElementById("project-tempo");

    // === External audio ===
    const audioVersions = document.getElementById("audio-versions");
    const audioVariants = document.querySelectorAll(".audio-variant");
    const audioPlayerContainer = document.getElementById("audio-player-container");
    const externalAudio = document.getElementById("external-audio");
    let currentAudio = null;
    let audioBaseUrl = null;

    const percNotes = ['F', 'c', 'g', 'e', 'd', 'A', 'a'];

    let fragments = [{ id: 0, title: "Вступление", abc: abcString }];
    let currentFragmentId = 0;

    let project = {
      title: "Новая песня",
      tempo: 120,
      fragments: fragments,
      audio: null
    };

    // === Dynamics toggle ===
    const toggleDynamics = document.getElementById("toggle-dynamics");
    const dynamicsPanel = document.getElementById("dynamics-panel");

    toggleDynamics.addEventListener("click", () => {
      const isVisible = dynamicsPanel.style.display === "block";
      dynamicsPanel.style.display = isVisible ? "none" : "block";
      toggleDynamics.textContent = isVisible ? "▶ Динамика" : "▼ Динамика";
    });

    function extractNotesFromABC(fullABC) {
      const lines = fullABC.split('\n');
      return lines.filter(line => {
        const t = line.trim();
        return t && !/^[A-Z]:/.test(t) && !/^%%/.test(t) && !/^X:|^T:|^L:|^M:|^K:|^Q:|^V:|^U:/.test(t);
      }).join('\n');
    }

    function createFullABCFromNotes(notes, fragmentTitle) {
      const tempo = parseInt(projectTempo.value) || 120;
      return `X:1
T:${project.title} - ${fragmentTitle}
L:1/16
M:4/4
K:C clef=perc
Q:1/4=${tempo}
V:Drums stem=up
U:n=!style=x!
%%percmap F  acoustic-bass-drum
%%percmap c  acoustic-snare
%%percmap g  closed-hi-hat x
%%percmap e  high-tom
%%percmap d  hi-mid-tom
%%percmap A  low-tom
%%percmap a  crash-cymbal-1  x
${notes.trim()}`;
    }

    function modifyPercNote(note, step) {
      const index = percNotes.indexOf(note);
      if (index === -1) return note;
      const newIndex = Math.max(0, Math.min(percNotes.length - 1, index - step));
      return percNotes[newIndex];
    }

    function tokenize(str) {
      const arr = str.split(/(!.+?!|".+?")/);
      const output = [];
      for (let i = 0; i < arr.length; i++) {
        const token = arr[i];
        if (token.length > 0) {
          if (token[0] !== '"' && token[0] !== '!') {
            const arr2 = token.split(/([A-Ga-g][,']*)/);
            output.push(...arr2.filter(t => t.length > 0));
          } else {
            output.push(token);
          }
        }
      }
      return output;
    }

    function clickListener(abcelem, tuneNumber, classes, analysis, drag) {
      if (drag && drag.step && abcelem.el_type === 'note' && abcelem.startChar >= 0 && abcelem.endChar >= 0) {
        const originalText = abcString.substring(abcelem.startChar, abcelem.endChar);
        const tokens = tokenize(originalText);
        let modified = false;
        for (let i = 0; i < tokens.length; i++) {
          if (percNotes.includes(tokens[i])) {
            tokens[i] = modifyPercNote(tokens[i], drag.step);
            modified = true;
          }
        }
        if (modified) {
          const newText = tokens.join("");
          abcString = abcString.substring(0, abcelem.startChar) + newText + abcString.substring(abcelem.endChar);
          const notesOnly = extractNotesFromABC(abcString);
          abcTextarea.value = notesOnly;
          const currentFragment = fragments.find(f => f.id === currentFragmentId);
          if (currentFragment) currentFragment.abc = notesOnly;
          refreshTune();
        }
      }
    }

    function CursorControl() {
      const self = this;
      self.onEvent = function(ev) {
        let cursor = document.querySelector("#paper svg .abcjs-cursor");
        if (!cursor) {
          const svg = document.querySelector("#paper svg");
          if (svg) {
            cursor = document.createElementNS("http://www.w3.org/2000/svg", "line");
            cursor.setAttribute("class", "abcjs-cursor");
            svg.appendChild(cursor);
          }
        }
        if (cursor && showCursor.checked && ev && ev.left != null) {
          cursor.setAttribute("x1", ev.left - 2);
          cursor.setAttribute("x2", ev.left - 2);
          cursor.setAttribute("y1", ev.top || 0);
          cursor.setAttribute("y2", (ev.top || 0) + (ev.height || 30));
        } else if (cursor) {
          cursor.setAttribute("x1", -10);
          cursor.setAttribute("x2", -10);
        }
      };
      self.onFinished = function() {
        const cursor = document.querySelector("#paper svg .abcjs-cursor");
        if (cursor) {
          cursor.setAttribute("x1", -10);
          cursor.setAttribute("x2", -10);
        }
      };
    }

    function stopExternalAudio() {
      if (externalAudio) {
        externalAudio.pause();
        externalAudio.currentTime = 0;
        audioPlayerContainer.style.display = "none";
        currentAudio = null;
        audioVariants.forEach(btn => btn.classList.remove("active"));
      }
    }

    function stopAbcPlayback() {
      if (synthControl) {
        synthControl.pause();
        synthControl.disable(true);
      }
    }

    function refreshTune() {
      stopExternalAudio();
      paperDiv.innerHTML = "";
      audioDiv.innerHTML = "";

      const currentFragment = fragments.find(f => f.id === currentFragmentId);
      if (!currentFragment) return;

      const notesOnly = abcTextarea.value;
      currentFragment.abc = notesOnly;
      const fullABC = createFullABCFromNotes(notesOnly, currentFragment.title);
      abcString = fullABC;

      if (!abcString.trim()) return;

      try {
        const options = {
          add_classes: true,
          responsive: "resize",
          dragging: true,
          clickListener: clickListener
        };

        const vo = ABCJS.renderAbc(paperDiv, abcString, options);
        if (!vo || vo.length === 0) throw new Error("Render failed");
        visualObj = vo[0];

        if (ABCJS.synth.supportsAudio()) {
          const cursorControl = new CursorControl();
          synthControl = new ABCJS.synth.SynthController();
          synthControl.load(audioDiv, cursorControl, {
            displayLoop: false,
            displayRestart: false,
            displayPlay: true,
            displayProgress: false,
            displayWarp: false
          });
          synthControl.disable(true);

          const bpmMatch = abcString.match(/Q:\s*1\/4\s*=\s*(\d+)/i);
          const bpm = bpmMatch ? parseInt(bpmMatch[1]) : parseInt(projectTempo.value) || 120;
          const msPerMeasure = (4 / bpm) * 60 * 1000;

          const midiBuffer = new ABCJS.synth.CreateSynth();
          midiBuffer.init({
            visualObj: visualObj,
            millisecondsPerMeasure: msPerMeasure
          }).then(() => {
            synthControl.setTune(visualObj, false).then(() => {
              synthControl.disable(false);
            });
          }).catch(err => {
            console.error("Synth init error:", err);
            audioDiv.innerHTML = "<p style='color:red;'>Ошибка аудио.</p>";
          });
        }
      } catch (e) {
        console.error("Render error:", e);
        paperDiv.innerHTML = `<p style="color:red;font-size:12px;">Ошибка: ${e.message}</p>`;
      }
    }

    function renderFragmentList() {
      fragmentList.innerHTML = "";
      fragments.forEach(fragment => {
        const div = document.createElement("div");
        div.className = "fragment-item";
        if (fragment.id === currentFragmentId) div.classList.add("active");

        const titleSpan = document.createElement("span");
        titleSpan.className = "fragment-title-text";
        titleSpan.textContent = fragment.title;

        const editBtn = document.createElement("span");
        editBtn.className = "fragment-edit";
        editBtn.textContent = "✎";
        editBtn.title = "Переименовать";

        div.appendChild(titleSpan);
        div.appendChild(editBtn);

        div.onclick = (e) => {
          if (e.target === editBtn) return;
          selectFragment(fragment.id);
        };

        editBtn.onclick = (e) => {
          e.stopPropagation();
          startEditing(fragment, div, titleSpan, editBtn);
        };

        fragmentList.appendChild(div);
      });
    }

    function startEditing(fragment, container, titleSpan, editBtn) {
      const input = document.createElement("input");
      input.type = "text";
      input.className = "fragment-edit-input";
      input.value = fragment.title;
      input.select();

      container.replaceChild(input, titleSpan);
      container.replaceChild(document.createTextNode(""), editBtn);

      input.focus();

      const finish = () => {
        fragment.title = input.value.trim() || "Без названия";
        renderFragmentList();
      };

      input.addEventListener("blur", finish);
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") finish();
        if (e.key === "Escape") {
          input.blur();
          renderFragmentList();
        }
      });
    }

    function selectFragment(id) {
      currentFragmentId = id;
      const fragment = fragments.find(f => f.id === id);
      if (fragment) {
        abcTextarea.value = fragment.abc;
        renderFragmentList();
        refreshTune();
        abcTextarea.focus(); // автофокус
      }
    }

    function addFragment() {
      const newId = fragments.length > 0 ? Math.max(...fragments.map(f => f.id)) + 1 : 0;
      fragments.push({
        id: newId,
        title: `Фрагмент ${fragments.length + 1}`,
        abc: "z16 | z16 | z16 | z16 |"
      });
      selectFragment(newId);
    }

    function deleteFragment() {
      if (fragments.length <= 1) return;
      fragments = fragments.filter(f => f.id !== currentFragmentId);
      if (fragments.length > 0) selectFragment(fragments[0].id);
    }

    function newProject() {
      projectTitle.value = "Новая песня";
      projectTempo.value = 120;
      fragments = [{ id: 0, title: "Вступление", abc: "z16 |" }];
      currentFragmentId = 0;
      project = { title: "Новая песня", tempo: 120, fragments: fragments, audio: null };
      hideAudioPanel();
      selectFragment(0);
      history.replaceState(null, '', '/song-editor/');
    }

    function hideAudioPanel() {
      audioVersions.style.display = "none";
      stopExternalAudio();
    }

    function showAudioPanel(audioObj, baseUrl) {
      project.audio = audioObj;
      audioBaseUrl = baseUrl;
      audioVersions.style.display = "block";
    }

    function setupAudioVariants() {
      audioVariants.forEach(btn => {
        btn.addEventListener("click", () => {
          const type = btn.dataset.type;
          if (!project.audio || !project.audio[type]) {
            alert(`Аудио "${type}" не доступно.`);
            return;
          }
          stopAbcPlayback();
          audioVariants.forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          const url = audioBaseUrl + project.audio[type];
          externalAudio.src = url;
          audioPlayerContainer.style.display = "block";
          externalAudio.play().catch(e => {
            console.error("Audio play failed:", e);
            alert("Ошибка воспроизведения: " + e.message);
          });
        });
      });
      externalAudio.addEventListener("play", stopAbcPlayback);
    }

    function saveProject() {
      const currentFragment = fragments.find(f => f.id === currentFragmentId);
      if (currentFragment) currentFragment.abc = abcTextarea.value;

      const fullProject = {
        title: projectTitle.value || "Без названия",
        category: "books",
        difficulty: "beginner",
        description: "",
        tempo: parseInt(projectTempo.value) || 120,
        version: "1.0",
        created: new Date().toISOString().split('T')[0],
        fragments: fragments,
        ...(project.audio ? { audio: project.audio } : {})
      };

      const dataStr = JSON.stringify(fullProject, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json;charset=utf-8' });
      const safeTitle = (projectTitle.value || "exercise").replace(/\s+/g, '_').replace(/[^a-zA-Z0-9_-]/g, '');
      const filename = `${safeTitle}.json`;
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      link.click();
      URL.revokeObjectURL(link.href);
    }

    function loadProject() {
      fileInput.click();
    }

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const projectData = JSON.parse(e.target.result);
          loadProjectData(projectData);
        } catch (error) {
          console.error("Ошибка загрузки:", error);
          paperDiv.innerHTML = `<p style="color:red;">Ошибка загрузки проекта.</p>`;
        }
      };
      reader.readAsText(file);
    }

    function extractBaseUrlFromLoadUrl(loadUrl) {
      if (!loadUrl) return null;
      const clean = loadUrl.split('?')[0];
      if (clean.endsWith('.json')) {
        const parts = clean.split('/');
        parts.pop();
        return parts.join('/') + '/';
      }
      return null;
    }

    function loadProjectData(projectData, loadUrl = null) {
      project.title = projectData.title || "Новая песня";
      project.tempo = projectData.tempo || 120;
      project.fragments = projectData.fragments || [{ id: 0, title: "Фрагмент", abc: "z16 |" }];
      project.audio = projectData.audio || null;

      projectTitle.value = project.title;
      projectTempo.value = project.tempo;
      fragments = [...project.fragments];

      hideAudioPanel();
      if (project.audio && loadUrl) {
        const baseUrl = extractBaseUrlFromLoadUrl(loadUrl);
        if (baseUrl) showAudioPanel(project.audio, baseUrl);
      }

      if (fragments.length > 0) {
        currentFragmentId = fragments[0].id;
        selectFragment(currentFragmentId);
      }
    }

    // ========== Library Modal ==========
    const modal = document.getElementById('library-modal');
    const closeModalBtn = document.getElementById('close-library-modal');
    const openLibraryBtn = document.getElementById('open-library');
    const treeContainer = document.getElementById('library-tree-container');
    let libraryTreeCache = null;

    function renderLibraryTree(items, parent = null) {
      const ul = document.createElement('div');
      ul.style.paddingLeft = parent ? '16px' : '0';
      for (const [name, item] of Object.entries(items)) {
        if (item.type === 'dir') {
          const folderDiv = document.createElement('div');
          folderDiv.className = 'library-folder collapsed';
          const toggle = document.createElement('span');
          toggle.className = 'toggle';
          const nameSpan = document.createElement('span');
          nameSpan.textContent = name;
          nameSpan.style.fontWeight = '600';
          nameSpan.style.color = '#1e40af';
          folderDiv.appendChild(toggle);
          folderDiv.appendChild(document.createTextNode('📁 '));
          folderDiv.appendChild(nameSpan);
          ul.appendChild(folderDiv);
          const childrenDiv = document.createElement('div');
          childrenDiv.style.display = 'none';
          folderDiv.appendChild(childrenDiv);
          folderDiv.addEventListener('click', (e) => {
            e.stopPropagation();
            folderDiv.classList.toggle('collapsed');
            folderDiv.classList.toggle('open');
            childrenDiv.style.display = folderDiv.classList.contains('collapsed') ? 'none' : 'block';
          });
          renderLibraryTree(item.children, childrenDiv);
        } else if (item.type === 'file') {
          const fileDiv = document.createElement('div');
          fileDiv.className = 'library-file';
          fileDiv.innerHTML = `📄 <span title="${item.title}">${item.title}</span>`;
          fileDiv.addEventListener('click', async () => {
            try {
              const res = await fetch(item.url);
              if (!res.ok) throw new Error('Файл не найден');
              const data = await res.json();
              loadProjectData(data, item.url);
              modal.style.display = 'none';
            } catch (err) {
              alert('Ошибка загрузки: ' + err.message);
            }
          });
          ul.appendChild(fileDiv);
        }
      }
      if (parent) parent.appendChild(ul);
      else { treeContainer.innerHTML = ''; treeContainer.appendChild(ul); }
    }

    async function loadLibraryTree() {
      if (libraryTreeCache) { renderLibraryTree(libraryTreeCache); return; }
      try {
        treeContainer.innerHTML = '<p style="text-align:center; padding:20px;">Загрузка…</p>';
        const res = await fetch('/library/tree.php');
        if (!res.ok) throw new Error('Не удалось загрузить библиотеку');
        libraryTreeCache = await res.json();
        renderLibraryTree(libraryTreeCache);
      } catch (err) {
        treeContainer.innerHTML = `<p style="color:red; text-align:center; padding:20px;">Ошибка: ${err.message}</p>`;
      }
    }

    openLibraryBtn.addEventListener('click', () => {
      modal.style.display = 'flex';
      if (!libraryTreeCache) loadLibraryTree();
    });

    closeModalBtn.addEventListener('click', () => modal.style.display = 'none');
    modal.addEventListener('click', (e) => { if (e.target === modal) modal.style.display = 'none'; });

    // === PDF Export ===
    function downloadAsPDF() {
      const paper = document.getElementById("paper");
      if (!paper || !paper.hasChildNodes()) { alert("Нет нот для экспорта."); return; }
      const originalBg = paper.style.background;
      const originalBoxShadow = paper.style.boxShadow;
      paper.style.background = "white"; paper.style.boxShadow = "none";
      html2canvas(paper, { scale: 2, backgroundColor: "#ffffff", useCORS: true, logging: false }).then(canvas => {
        const imgData = canvas.toDataURL("image/png");
        const pdf = new window.jspdf.jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });
        const imgWidth = 210, pageHeight = 297;
        const imgHeight = (canvas.height * imgWidth) / canvas.width;
        let heightLeft = imgHeight, position = 0;
        pdf.addImage(imgData, "PNG", 0, position, imgWidth, imgHeight);
        heightLeft -= pageHeight;
        while (heightLeft >= 0) {
          pdf.addPage(); position = heightLeft - imgHeight;
          pdf.addImage(imgData, "PNG", 0, position, imgWidth, imgHeight);
          heightLeft -= pageHeight;
        }
        paper.style.background = originalBg; paper.style.boxShadow = originalBoxShadow;
        const filename = (projectTitle.value || "упражнение").replace(/[^a-zа-я0-9_-]/gi, "_") + ".pdf";
        pdf.save(filename);
      }).catch(err => {
        console.error("Ошибка генерации PDF:", err);
        alert("Не удалось создать PDF.");
        paper.style.background = originalBg; paper.style.boxShadow = originalBoxShadow;
      });
    }

    // === Делегирование кликов по активным кнопкам ===
    activeNoteButtons.addEventListener("click", (e) => {
      if (e.target.classList.contains("note-btn")) {
        const note = e.target.dataset.note;
        insertAtCursor(abcTextarea, note + " ");
        const currentFragment = fragments.find(f => f.id === currentFragmentId);
        if (currentFragment) currentFragment.abc = abcTextarea.value;
        refreshTune();
      }
    });
	
	// Делегирование кликов по кнопкам динамики
document.getElementById("dynamics-panel").addEventListener("click", (e) => {
  if (e.target.classList.contains("note-btn")) {
    const note = e.target.dataset.note;
    insertAtCursor(abcTextarea, note + " ");
    const currentFragment = fragments.find(f => f.id === currentFragmentId);
    if (currentFragment) currentFragment.abc = abcTextarea.value;
    refreshTune();
  }
});

    // ========== INIT ==========
    document.addEventListener("DOMContentLoaded", () => {
      setupAudioVariants();
      renderFragmentList();
      refreshTune();

      renderBtn.addEventListener("click", refreshTune);
      addFragmentBtn.addEventListener("click", addFragment);
      deleteFragmentBtn.addEventListener("click", deleteFragment);
      saveProjectBtn.addEventListener("click", saveProject);
      loadProjectBtn.addEventListener("click", loadProject);
      document.getElementById("new-project")?.addEventListener("click", newProject);
      document.getElementById("download-pdf")?.addEventListener("click", downloadAsPDF);
      fileInput.addEventListener("change", handleFileSelect);

      let debounceTimer;
      abcTextarea.addEventListener("input", () => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
          const currentFragment = fragments.find(f => f.id === currentFragmentId);
          if (currentFragment) currentFragment.abc = abcTextarea.value;
          refreshTune();
        }, 500);
      });

      const refreshOptions = () => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(refreshTune, 100);
      };
      showCursor.addEventListener("change", refreshOptions);
      projectTitle.addEventListener("input", () => { project.title = projectTitle.value; });
      projectTempo.addEventListener("input", () => {
        const tempo = parseInt(projectTempo.value);
        if (!isNaN(tempo) && tempo >= 40 && tempo <= 300) project.tempo = tempo;
      });

      const urlParams = new URLSearchParams(window.location.search);
      const loadUrl = urlParams.get('load');
      if (loadUrl) {
        if (loadUrl.startsWith('/') || loadUrl.startsWith('https://drumz.ru/')) {
          fetch(loadUrl)
            .then(response => { if (!response.ok) throw new Error('Файл не найден'); return response.json(); })
            .then(projectData => { loadProjectData(projectData, loadUrl); })
            .catch(err => {
              console.error("Ошибка загрузки упражнения:", err);
              paperDiv.innerHTML = `<p style="color:red;">Ошибка загрузки: ${err.message}</p>`;
            });
        } else {
          console.warn("Blocked unsafe load URL:", loadUrl);
        }
      }
    });
  </script>
